<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — DPG Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">DPG</span>
      <span class="brand-text">
        <span class="brand-college">DPG Institute of Technology and Management</span>
        <span class="brand-sub">Lost &amp; Found Portal</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Browse</a>
      <a href="post-item.html">Post Item</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
      <button class="hamburger" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-panel">
    <a href="index.html">Browse</a>
    <a href="post-item.html">Post Item</a>
  </div>
</header>

<section class="section">
  <div class="container form-shell" style="max-width:420px;">
    <div class="hero-eyebrow">Welcome back</div>
    <h1 style="font-size:26px; margin-bottom:24px;">Log in to your account</h1>

    <form id="login-form">
      <div class="field">
        <label for="email">College email</label>
        <input id="email" type="email" placeholder="yourname@dpgitm.ac.in" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:13px;">Log in</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-soft);">
      New here? <a href="signup.html" style="color:var(--amber-deep); font-weight:600;">Create an account</a>
    </p>
  </div>
</section>

<footer>
  <div class="container">
    <span class="foot-brand">DPG · LOST &amp; FOUND</span>
    <span>Built by students, for students.</span>
  </div>
</footer>

<script src="js/theme.js"></script>
<script src="js/nav.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
